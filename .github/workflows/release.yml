name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: ./script/licenses.sh check --ignore github.com/ishinova/gh-user-attachments .
      - run: |
          tmpdir="$(mktemp -d)"
          ./script/licenses.sh save --ignore github.com/ishinova/gh-user-attachments --save_path "$tmpdir/licenses" .
          diff -r "$tmpdir/licenses" third_party_licenses

  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: cli/gh-extension-precompile@76961aa3bd1123d0a6fd42d0a41aca0696937c39 # v2.2.0
        with:
          build_script_override: script/build.sh
          generate_attestations: true
          go_version_file: go.mod
